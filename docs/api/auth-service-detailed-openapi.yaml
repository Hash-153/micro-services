openapi: 3.0.3
info:
  title: NovaCommerce Auth & IAM Service
  version: 1.0.0
  description: Exhaustive OpenAPI 3.0 specification for Auth & IAM Service with comprehensive schema validation.
servers:
  - url: http://localhost:8000/api/v1/auth
    description: API Gateway Proxy
paths:
  /register:
    post:
      summary: Register new user account
      operationId: auth_post__register
      tags:
        - Auth
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad request / validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '409':
          description: Conflict
        '500':
          description: Internal server error
