openapi: 3.0.3
info:
  title: NovaCommerce Payment & Ledger Service
  version: 1.0.0
  description: Exhaustive OpenAPI 3.0 specification for Payment & Ledger Service with comprehensive schema validation.
servers:
  - url: http://localhost:8000/api/v1/payment
    description: API Gateway Proxy
paths:
  /payments/authorize:
    post:
      summary: Authorize payment transaction
      operationId: payment_post__payments_authorize
      tags:
        - Payment
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad request / validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '409':
          description: Conflict
        '500':
          description: Internal server error
