openapi: 3.0.3
info:
  title: NovaCommerce Real-Time Telemetry & Compliance Audit Service
  version: 1.0.0
  description: |
    Comprehensive production OpenAPI 3.0 specification for Real-Time Telemetry & Compliance Audit Service.
    Adheres strictly to RFC-7807 problem details, ISO 8601 timestamps, and JSON-Schema Draft 7 validation.
  contact:
    name: NovaCommerce Engineering Architecture
    email: architecture@novacommerce.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000/api/v1/analytics
    description: API Gateway Proxy Endpoint
  - url: http://localhost:8008
    description: Direct Microservice Local Container Port

security:
  - BearerAuth: []

paths:
  /events:
    post:
      summary: Ingest Clickstream Telemetry
      description: |
        Streams clickstream and user interaction events.
      operationId: analytics_post__events
      tags:
        - Analytics
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Distributed tracing correlation identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventPayload'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request / Schema validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Insufficient RBAC role permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Requested resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict / Idempotency lock active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Unprocessable business entity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Sliding window rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error / Saga execution rollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /summary:
    get:
      summary: Query Event Aggregations
      description: |
        Aggregates event counts by category and timeframe.
      operationId: analytics_get__summary
      tags:
        - Analytics
      parameters:
