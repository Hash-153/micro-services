        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentPayload'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: Bad request / Schema validation error
