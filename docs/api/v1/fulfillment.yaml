openapi: 3.0.3
info:
  title: NovaCommerce Fulfillment & Courier Logistics Service
  version: 1.0.0
  description: |
    Comprehensive production OpenAPI 3.0 specification for Fulfillment & Courier Logistics Service.
    Adheres strictly to RFC-7807 problem details, ISO 8601 timestamps, and JSON-Schema Draft 7 validation.
  contact:
    name: NovaCommerce Engineering Architecture
    email: architecture@novacommerce.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000/api/v1/fulfillment
    description: API Gateway Proxy Endpoint
  - url: http://localhost:8006
    description: Direct Microservice Local Container Port

security:
  - BearerAuth: []

