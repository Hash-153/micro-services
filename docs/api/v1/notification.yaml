        '422':
          description: Unprocessable business entity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Sliding window rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error / Saga execution rollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /templates:
    get:
      summary: List Transactional Templates
      description: |
        Lists registered transactional HTML and SMS templates.
      operationId: notification_get__templates
      tags:
        - Notification
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Distributed tracing correlation identifier
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
